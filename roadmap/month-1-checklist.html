<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month 1 :: Python Foundations & Data Structures</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0f1715;
    --bg-raised: #16211e;
    --bg-card: #1a2622;
    --line: #2a3934;
    --line-soft: #223029;
    --ink: #e8efe9;
    --ink-dim: #93a89e;
    --ink-faint: #5e746a;
    --amber: #e8a355;
    --amber-dim: #7a5a34;
    --teal: #5fc9b0;
    --teal-dim: #2c5147;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(232,239,233,0.035) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:rgba(15,23,21,0.92);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--amber); margin-bottom:6px;
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px; font-weight:600; margin:0; line-height:1.3;
    color:var(--ink);
  }

  main{padding:20px 16px 0; max-width:640px; margin:0 auto;}

  .month-header{
    margin:28px 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--amber-dim);
    display:flex; align-items:baseline; gap:8px;
  }
  main > .month-header:first-child{margin-top:0;}
  .month-title{
    font-size:12px; letter-spacing:0.06em; color:var(--amber);
  }

  .week{
    margin-bottom:14px;
    border:1px solid var(--line);
    background:var(--bg-card);
    border-radius:3px;
    overflow:hidden;
  }
  .week-head{
    display:flex; align-items:baseline; gap:10px;
    padding:16px 16px 12px;
  }
  .week-num{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:0.1em;
  }
  .week-title{font-size:15px; font-weight:600; color:var(--ink);}

  .topic-list{
    border-top:1px solid var(--line-soft);
    padding:6px 16px 14px;
  }
  .topic-link{
    display:flex; align-items:center; gap:10px;
    padding:9px 0;
    text-decoration:none;
    border-bottom:1px solid var(--line-soft);
  }
  .topic-link:last-child{border-bottom:none;}
  .topic-name{
    font-size:13.5px; line-height:1.5; color:var(--ink-dim);
    flex:1;
    transition:color 0.15s ease;
  }
  .topic-link:hover .topic-name{color:var(--ink);}
  .topic-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:2px; padding:2px 6px;
    flex-shrink:0;
  }
  .topic-arrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal);
    flex-shrink:0; opacity:0.7; transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .topic-link:hover .topic-arrow{opacity:1; transform:translateX(2px);}

  .checkpoint{
    margin:6px 16px 14px;
    padding:14px 16px;
    background:var(--bg-raised);
    border:1px dashed var(--amber-dim);
    border-radius:3px;
  }
  .checkpoint-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--amber); margin-bottom:6px;
  }
  .checkpoint-text{font-size:13px; color:var(--ink-dim); line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">month 1 roadmap</div>
  <h1>Month 1: Python Foundations, Internals, Async & Core Data Structures</h1>
</header>

<main id="main"></main>

<script>
const MONTH = {
  title: "Month 1: Python Foundations, Internals, Async & Core Data Structures",
  weeks: [
    { label: "Week 1", title: "Python Syntax Foundations", topics: [
      { name: "Mutability, scoping, closures, *args/**kwargs", tag: "core", href: "../python/memory_and_scoping.html" },
      { name: "Comprehensions & unpacking", tag: "core", href: "../python/comprehensions_and_unpacking.html" },
      { name: "Decorators + functools", tag: "core", href: "../python/decorators.html" },
      { name: "System Design: latency, throughput, scaling vocab", tag: "thu", href: "../systems/latency_and_throughput.html" },
      { name: "DB Design: relational fundamentals, PK/FK", tag: "fri", href: "../database/tables_and_keys.html" },
      { name: "OOP part 1: classes, dataclasses, dunders", tag: "core", href: "../python/classes_and_dunders.html" }
    ]},
    { label: "Week 2", title: "OOP, Generators & Context Managers", topics: [
      { name: "OOP part 2: composition vs inheritance, @property", tag: "core", href: "../python/oop_composition_and_abc.html" },
      { name: "Iterators/generators", tag: "core", href: "../python/iterators_and_generators.html" },
      { name: "Context managers", tag: "core", href: "../python/context_managers.html" },
      { name: "System Design: vertical vs horizontal, deep dive", tag: "thu", href: "../systems/vertical_vs_horizontal_scaling.html" },
      { name: "DB Design: normalization 1NF–2NF", tag: "fri", href: "../database/normalization_1nf_2nf.html" }
    ]},
    { label: "Week 3", title: "Packaging, Typing, Errors + Checkpoint", topics: [
      { name: "Modules & packaging", tag: "core", href: "../python/modules_and_packaging.html" },
      { name: "Typing", tag: "core", href: "../python/typing.html" },
      { name: "Error handling", tag: "core", href: "../python/error_handling.html" },
      { name: "System Design: stateless vs stateful", tag: "thu", href: "../systems/stateless_vs_stateful.html" },
      { name: "DB Design: normalization 3NF + ER modeling", tag: "fri", href: "../database/normalization_3nf_and_er_modeling.html" }
    ], checkpoint: "From memory: write a decorator, a context manager, and a generator-based pipeline. No reference material." },
    { label: "Week 4", title: "Linked Lists & Trees (Growth, Rotations)", topics: [
      { name: "Big-O by hand; Linked Lists", tag: "core", href: "../dsa/big_o_and_linked_lists.html" },
      { name: "Trees deep dive 1: BST mechanics", tag: "core", href: "../dsa/bst_mechanics.html" },
      { name: "Trees deep dive 2: rotations & balancing ('growth')", tag: "core", href: "../dsa/tree_rotations_and_balancing.html" },
      { name: "System Design: load balancers", tag: "thu", href: "../systems/load_balancers.html" }
    ]},
    { label: "Week 5", title: "Graphs, Hash Maps & Heaps from Scratch", topics: [
      { name: "Graphs: representations, BFS/DFS", tag: "core", href: "../dsa/graphs_bfs_dfs.html" },
      { name: "Graphs continued: cycle detection", tag: "core", href: "../dsa/graph_cycle_detection.html" },
      { name: "Hash Maps from scratch", tag: "core", href: "../dsa/hash_maps_from_scratch.html" },
      { name: "System Design: CDNs", tag: "thu", href: "../systems/cdns.html" },
      { name: "Heaps from scratch", tag: "core", href: "../dsa/heaps_from_scratch.html" }
    ], checkpoint: "Explain, from memory, how a BST rebalances and why a hash map needs collision handling." },
    { label: "Week 6", title: "CPython Internals, Concurrency & Survival Exercise", topics: [
      { name: "CPython internals: refcounting, GC", tag: "core", href: "../python/cpython_internals.html" },
      { name: "The GIL", tag: "core", href: "../python/the_gil.html" },
      { name: "asyncio", tag: "core", href: "../python/asyncio_fundamentals.html" },
      { name: "Non-blocking I/O vs threading/multiprocessing", tag: "thu", href: "../systems/nonblocking_io_vs_threading.html" },
      { name: "DB Design: SQL vs NoSQL", tag: "fri", href: "../database/sql_vs_nosql.html" },
      { name: "Survival Exercise: raw select/selectors", tag: "sat", href: "../dsa/raw_sockets_event_loop.html" }
    ], checkpoint: "Write a decorator, context manager, and generator pipeline from memory. Explain tree rotations and hash collisions out loud. Async TCP server (select/selectors) handles 50+ concurrent connections without blocking." }
  ]
};

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const monthHeader = document.createElement('div');
  monthHeader.className = 'month-header';
  monthHeader.innerHTML = `<span class="month-title mono">${MONTH.title}</span>`;
  main.appendChild(monthHeader);

  MONTH.weeks.forEach((wk) => {
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `
      <span class="week-num mono">${wk.label}</span>
      <span class="week-title">${wk.title}</span>
    `;
    weekEl.appendChild(head);

    const list = document.createElement('div');
    list.className = 'topic-list';
    wk.topics.forEach((t) => {
      const a = document.createElement('a');
      a.className = 'topic-link';
      a.href = t.href;
      a.innerHTML = `
        <span class="topic-name">${t.name}</span>
        <span class="topic-tag mono">${t.tag}</span>
        <span class="topic-arrow mono">&rarr;</span>
      `;
      list.appendChild(a);
    });
    weekEl.appendChild(list);
    main.appendChild(weekEl);

    if (wk.checkpoint) {
      const cp = document.createElement('div');
      cp.className = 'checkpoint';
      cp.innerHTML = `<div class="checkpoint-label mono">checkpoint — ${wk.label}</div><div class="checkpoint-text">${wk.checkpoint}</div>`;
      main.appendChild(cp);
    }
  });
}

render();
</script>

</body>
</html>
