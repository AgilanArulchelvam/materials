<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month 6 :: Capstone Integration & Interview Execution</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0f1715;
    --bg-raised: #16211e;
    --bg-card: #1a2622;
    --line: #2a3934;
    --line-soft: #223029;
    --ink: #e8efe9;
    --ink-dim: #93a89e;
    --ink-faint: #5e746a;
    --amber: #e8a355;
    --amber-dim: #7a5a34;
    --teal: #5fc9b0;
    --teal-dim: #2c5147;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(232,239,233,0.035) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:rgba(15,23,21,0.92);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--amber); margin-bottom:6px;
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px; font-weight:600; margin:0; line-height:1.3;
    color:var(--ink);
  }

  main{padding:20px 16px 0; max-width:640px; margin:0 auto;}

  .month-header{
    margin:28px 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--amber-dim);
    display:flex; align-items:baseline; gap:8px;
  }
  main > .month-header:first-child{margin-top:0;}
  .month-title{
    font-size:12px; letter-spacing:0.06em; color:var(--amber);
  }

  .week{
    margin-bottom:14px;
    border:1px solid var(--line);
    background:var(--bg-card);
    border-radius:3px;
    overflow:hidden;
  }
  .week-head{
    display:flex; align-items:baseline; gap:10px;
    padding:16px 16px 12px;
  }
  .week-num{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:0.1em;
  }
  .week-title{font-size:15px; font-weight:600; color:var(--ink);}

  .topic-list{
    border-top:1px solid var(--line-soft);
    padding:6px 16px 14px;
  }
  .topic-link{
    display:flex; align-items:center; gap:10px;
    padding:9px 0;
    text-decoration:none;
    border-bottom:1px solid var(--line-soft);
  }
  .topic-link:last-child{border-bottom:none;}
  .topic-name{
    font-size:13.5px; line-height:1.5; color:var(--ink-dim);
    flex:1;
    transition:color 0.15s ease;
  }
  .topic-link:hover .topic-name{color:var(--ink);}
  .topic-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:2px; padding:2px 6px;
    flex-shrink:0;
  }
  .topic-arrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal);
    flex-shrink:0; opacity:0.7; transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .topic-link:hover .topic-arrow{opacity:1; transform:translateX(2px);}

  .checkpoint{
    margin:6px 16px 14px;
    padding:14px 16px;
    background:var(--bg-raised);
    border:1px dashed var(--amber-dim);
    border-radius:3px;
  }
  .checkpoint-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--amber); margin-bottom:6px;
  }
  .checkpoint-text{font-size:13px; color:var(--ink-dim); line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">month 6 roadmap</div>
  <h1>Month 6: Capstone Integration, System Design & Interview Execution</h1>
</header>

<main id="main"></main>

<script>
const MONTH = {
  title: "Month 6: Capstone Integration, System Design & Interview Execution",
  weeks: [
    { label: "Week 1", title: "System Design Mocks", topics: [
      { name: "Enterprise MCP agent gateway design", tag: "core", href: "../systems/enterprise_mcp_agent_gateway_design.html" },
      { name: "Distributed telemetry ingester design", tag: "core", href: "../systems/distributed_telemetry_ingester_design.html" },
      { name: "Real-time RAG engine design", tag: "core", href: "../storage-and-rag/realtime_rag_engine_design.html" },
      { name: "Combined mock: DSA + schema + system design, timed", tag: "thu", href: "../dsa/combined_timed_mock_dsa_schema_system_design.html" },
      { name: "DB Design: capacity estimation practice", tag: "fri", href: "../database/capstone_capacity_estimation_practice.html" },
      { name: "Scaffold capstone", tag: "sat", href: "../backend/capstone_scaffold_fastapi_mcp.html" }
    ]},
    { label: "Week 2", title: "Capstone Build I", topics: [
      { name: "Multi-agent orchestrator integration", tag: "core", href: "../mcp-and-agents/capstone_orchestrator_integration.html" },
      { name: "Hybrid vector search integration", tag: "core", href: "../storage-and-rag/capstone_hybrid_search_integration.html" },
      { name: "Eval/tracing dashboard integration", tag: "core", href: "../evals-and-observability/capstone_dashboard_integration.html" },
      { name: "Combined mock interview, timed", tag: "thu", href: "../dsa/capstone_combined_mock_full_loop.html" },
      { name: "DB Design: finalize capstone schema", tag: "fri", href: "../database/capstone_schema_finalization_and_indexes.html" },
      { name: "Integration testing", tag: "sat", href: "../backend/capstone_integration_testing.html" }
    ]},
    { label: "Week 3", title: "Capstone Build II & Polish", topics: [
      { name: "Fix integration issues", tag: "core", href: "../backend/capstone_debugging_integration_issues.html" },
      { name: "Load test capstone", tag: "core", href: "../systems/capstone_load_testing.html" },
      { name: "Documentation / architecture diagram", tag: "core", href: "../backend/capstone_architecture_documentation.html" },
      { name: "Combined mock interview, timed", tag: "thu", href: "../dsa/capstone_combined_mock_full_loop_round2.html" },
      { name: "DB Design: defend schema cold", tag: "fri", href: "../database/capstone_schema_cold_defense.html" },
      { name: "Record capstone walkthrough", tag: "sat", href: "../backend/capstone_walkthrough_recording_guide.html" }
    ]},
    { label: "Week 4", title: "Interview Execution", topics: [
      { name: "Daily combined mock — Monday", tag: "core", href: "../dsa/interview_week_monday_mock.html" },
      { name: "Daily combined mock — Tuesday", tag: "core", href: "../dsa/interview_week_tuesday_mock.html" },
      { name: "Daily combined mock — Wednesday", tag: "core", href: "../dsa/interview_week_wednesday_mock.html" },
      { name: "Daily combined mock — Thursday", tag: "core", href: "../dsa/interview_week_thursday_mock.html" },
      { name: "Daily combined mock — Friday", tag: "core", href: "../dsa/interview_week_friday_mock.html" },
      { name: "Daily combined mock — Saturday", tag: "core", href: "../dsa/interview_week_saturday_mock.html" }
    ], checkpoint: "Walk someone through the capstone's schema and architecture, cold, in under 10 minutes — including what breaks first at 10x scale and how you'd redesign the schema for it." }
  ]
};

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const monthHeader = document.createElement('div');
  monthHeader.className = 'month-header';
  monthHeader.innerHTML = `<span class="month-title mono">${MONTH.title}</span>`;
  main.appendChild(monthHeader);

  MONTH.weeks.forEach((wk) => {
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `
      <span class="week-num mono">${wk.label}</span>
      <span class="week-title">${wk.title}</span>
    `;
    weekEl.appendChild(head);

    const list = document.createElement('div');
    list.className = 'topic-list';
    wk.topics.forEach((t) => {
      const a = document.createElement('a');
      a.className = 'topic-link';
      a.href = t.href;
      a.innerHTML = `
        <span class="topic-name">${t.name}</span>
        <span class="topic-tag mono">${t.tag}</span>
        <span class="topic-arrow mono">&rarr;</span>
      `;
      list.appendChild(a);
    });
    weekEl.appendChild(list);
    main.appendChild(weekEl);

    if (wk.checkpoint) {
      const cp = document.createElement('div');
      cp.className = 'checkpoint';
      cp.innerHTML = `<div class="checkpoint-label mono">checkpoint — ${wk.label}</div><div class="checkpoint-text">${wk.checkpoint}</div>`;
      main.appendChild(cp);
    }
  });
}

render();
</script>

</body>
</html>
