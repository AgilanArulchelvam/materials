<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month 4 :: MCP, Agentic Frameworks & Function Calling</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0f1715;
    --bg-raised: #16211e;
    --bg-card: #1a2622;
    --line: #2a3934;
    --line-soft: #223029;
    --ink: #e8efe9;
    --ink-dim: #93a89e;
    --ink-faint: #5e746a;
    --amber: #e8a355;
    --amber-dim: #7a5a34;
    --teal: #5fc9b0;
    --teal-dim: #2c5147;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(232,239,233,0.035) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:rgba(15,23,21,0.92);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--amber); margin-bottom:6px;
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px; font-weight:600; margin:0; line-height:1.3;
    color:var(--ink);
  }

  main{padding:20px 16px 0; max-width:640px; margin:0 auto;}

  .month-header{
    margin:28px 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--amber-dim);
    display:flex; align-items:baseline; gap:8px;
  }
  main > .month-header:first-child{margin-top:0;}
  .month-title{
    font-size:12px; letter-spacing:0.06em; color:var(--amber);
  }

  .week{
    margin-bottom:14px;
    border:1px solid var(--line);
    background:var(--bg-card);
    border-radius:3px;
    overflow:hidden;
  }
  .week-head{
    display:flex; align-items:baseline; gap:10px;
    padding:16px 16px 12px;
  }
  .week-num{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:0.1em;
  }
  .week-title{font-size:15px; font-weight:600; color:var(--ink);}

  .topic-list{
    border-top:1px solid var(--line-soft);
    padding:6px 16px 14px;
  }
  .topic-link{
    display:flex; align-items:center; gap:10px;
    padding:9px 0;
    text-decoration:none;
    border-bottom:1px solid var(--line-soft);
  }
  .topic-link:last-child{border-bottom:none;}
  .topic-name{
    font-size:13.5px; line-height:1.5; color:var(--ink-dim);
    flex:1;
    transition:color 0.15s ease;
  }
  .topic-link:hover .topic-name{color:var(--ink);}
  .topic-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:2px; padding:2px 6px;
    flex-shrink:0;
  }
  .topic-arrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal);
    flex-shrink:0; opacity:0.7; transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .topic-link:hover .topic-arrow{opacity:1; transform:translateX(2px);}

  .checkpoint{
    margin:6px 16px 14px;
    padding:14px 16px;
    background:var(--bg-raised);
    border:1px dashed var(--amber-dim);
    border-radius:3px;
  }
  .checkpoint-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--amber); margin-bottom:6px;
  }
  .checkpoint-text{font-size:13px; color:var(--ink-dim); line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">month 4 roadmap</div>
  <h1>Month 4: Model Context Protocol (MCP), Agentic Frameworks & Function Calling</h1>
</header>

<main id="main"></main>

<script>
const MONTH = {
  title: "Month 4: Model Context Protocol (MCP), Agentic Frameworks & Function Calling",
  weeks: [
    { label: "Week 1", title: "MCP Spec", topics: [
      { name: "MCP fundamentals — JSON-RPC", tag: "core", href: "../mcp-and-agents/mcp_fundamentals_jsonrpc.html" },
      { name: "Build custom MCP server (stdio)", tag: "core", href: "../mcp-and-agents/mcp_server_stdio.html" },
      { name: "Build custom MCP server (SSE)", tag: "core", href: "../mcp-and-agents/mcp_server_sse.html" },
      { name: "System Design: MCP gateway serving multiple agents", tag: "thu", href: "../mcp-and-agents/mcp_gateway_design.html" },
      { name: "DB Design: agent state/memory schemas", tag: "fri", href: "../database/agent_memory_schemas.html" },
      { name: "Build custom MCP client", tag: "sat", href: "../mcp-and-agents/mcp_client_basics.html" }
    ]},
    { label: "Week 2", title: "Agentic Patterns", topics: [
      { name: "ReAct pattern", tag: "core", href: "../mcp-and-agents/react_pattern.html" },
      { name: "Plan-and-Solve pattern", tag: "core", href: "../mcp-and-agents/plan_and_solve_pattern.html" },
      { name: "Stateful graphs", tag: "core", href: "../mcp-and-agents/stateful_graphs.html" },
      { name: "System Design: async tool-execution job queue", tag: "thu", href: "../backend/async_tool_job_queue_design.html" },
      { name: "DB Design: conversation history schema", tag: "fri", href: "../database/conversation_history_schema.html" },
      { name: "Multi-agent delegation", tag: "sat", href: "../mcp-and-agents/multi_agent_delegation.html" }
    ]},
    { label: "Week 3", title: "Function Calling", topics: [
      { name: "JSON Schema tool specs", tag: "core", href: "../mcp-and-agents/json_schema_tool_specs.html" },
      { name: "Deterministic parsing of model output", tag: "core", href: "../mcp-and-agents/deterministic_parsing.html" },
      { name: "Loop-termination logic", tag: "core", href: "../mcp-and-agents/loop_termination_logic.html" },
      { name: "System Design: review MCP gateway + job queue cold", tag: "thu", href: "../backend/system_design_review_month4_cold.html" },
      { name: "DB Design: audit trail schema", tag: "fri", href: "../database/audit_trail_schema.html" },
      { name: "Practice: raw function-calling loop end to end", tag: "sat", href: "../mcp-and-agents/function_calling_loop_practice.html" }
    ]},
    { label: "Week 4", title: "Agent Security & Survival Exercise", topics: [
      { name: "Prompt injection risks", tag: "core", href: "../mcp-and-agents/prompt_injection_risks.html" },
      { name: "Tool-call sandboxing", tag: "core", href: "../mcp-and-agents/tool_call_sandboxing.html" },
      { name: "Permission scoping", tag: "core", href: "../mcp-and-agents/permission_scoping.html" },
      { name: "System Design: review cold", tag: "thu", href: "../backend/system_design_review_month4_final_cold.html" },
      { name: "DB Design: event sourcing vs CRUD", tag: "fri", href: "../database/event_sourcing_vs_crud.html" },
      { name: "Build multi-agent workflow + finish", tag: "sat", href: "../mcp-and-agents/final_multi_agent_workflow.html" }
    ], checkpoint: "Agent completes a 3-step task end-to-end with one deliberately injected tool failure, and recovers or fails gracefully." }
  ]
};

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const monthHeader = document.createElement('div');
  monthHeader.className = 'month-header';
  monthHeader.innerHTML = `<span class="month-title mono">${MONTH.title}</span>`;
  main.appendChild(monthHeader);

  MONTH.weeks.forEach((wk) => {
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `
      <span class="week-num mono">${wk.label}</span>
      <span class="week-title">${wk.title}</span>
    `;
    weekEl.appendChild(head);

    const list = document.createElement('div');
    list.className = 'topic-list';
    wk.topics.forEach((t) => {
      const a = document.createElement('a');
      a.className = 'topic-link';
      a.href = t.href;
      a.innerHTML = `
        <span class="topic-name">${t.name}</span>
        <span class="topic-tag mono">${t.tag}</span>
        <span class="topic-arrow mono">&rarr;</span>
      `;
      list.appendChild(a);
    });
    weekEl.appendChild(list);
    main.appendChild(weekEl);

    if (wk.checkpoint) {
      const cp = document.createElement('div');
      cp.className = 'checkpoint';
      cp.innerHTML = `<div class="checkpoint-label mono">checkpoint — ${wk.label}</div><div class="checkpoint-text">${wk.checkpoint}</div>`;
      main.appendChild(cp);
    }
  });
}

render();
</script>

</body>
</html>
