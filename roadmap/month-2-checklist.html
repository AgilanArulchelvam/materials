<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month 2 :: Backend API Design & Relational Databases</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0f1715;
    --bg-raised: #16211e;
    --bg-card: #1a2622;
    --line: #2a3934;
    --line-soft: #223029;
    --ink: #e8efe9;
    --ink-dim: #93a89e;
    --ink-faint: #5e746a;
    --amber: #e8a355;
    --amber-dim: #7a5a34;
    --teal: #5fc9b0;
    --teal-dim: #2c5147;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(232,239,233,0.035) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:rgba(15,23,21,0.92);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--amber); margin-bottom:6px;
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px; font-weight:600; margin:0; line-height:1.3;
    color:var(--ink);
  }

  main{padding:20px 16px 0; max-width:640px; margin:0 auto;}

  .month-header{
    margin:28px 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--amber-dim);
    display:flex; align-items:baseline; gap:8px;
  }
  main > .month-header:first-child{margin-top:0;}
  .month-title{
    font-size:12px; letter-spacing:0.06em; color:var(--amber);
  }

  .week{
    margin-bottom:14px;
    border:1px solid var(--line);
    background:var(--bg-card);
    border-radius:3px;
    overflow:hidden;
  }
  .week-head{
    display:flex; align-items:baseline; gap:10px;
    padding:16px 16px 12px;
  }
  .week-num{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:0.1em;
  }
  .week-title{font-size:15px; font-weight:600; color:var(--ink);}

  .topic-list{
    border-top:1px solid var(--line-soft);
    padding:6px 16px 14px;
  }
  .topic-link{
    display:flex; align-items:center; gap:10px;
    padding:9px 0;
    text-decoration:none;
    border-bottom:1px solid var(--line-soft);
  }
  .topic-link:last-child{border-bottom:none;}
  .topic-name{
    font-size:13.5px; line-height:1.5; color:var(--ink-dim);
    flex:1;
    transition:color 0.15s ease;
  }
  .topic-link:hover .topic-name{color:var(--ink);}
  .topic-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:2px; padding:2px 6px;
    flex-shrink:0;
  }
  .topic-arrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal);
    flex-shrink:0; opacity:0.7; transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .topic-link:hover .topic-arrow{opacity:1; transform:translateX(2px);}

  .checkpoint{
    margin:6px 16px 14px;
    padding:14px 16px;
    background:var(--bg-raised);
    border:1px dashed var(--amber-dim);
    border-radius:3px;
  }
  .checkpoint-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--amber); margin-bottom:6px;
  }
  .checkpoint-text{font-size:13px; color:var(--ink-dim); line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">month 2 roadmap</div>
  <h1>Month 2: Backend API Design, Relational Databases & Protocol Mechanics</h1>
</header>

<main id="main"></main>

<script>
const MONTH = {
  title: "Month 2: Backend API Design, Relational Databases & Protocol Mechanics",
  weeks: [
    { label: "Week 1", title: "FastAPI Fundamentals", topics: [
      { name: "FastAPI routing & Pydantic V2 validation", tag: "core", href: "../backend/fastapi_routing_and_pydantic.html" },
      { name: "Dependency injection", tag: "core", href: "../backend/dependency_injection.html" },
      { name: "Custom middleware", tag: "core", href: "../backend/custom_middleware.html" },
      { name: "System Design: URL shortener", tag: "thu", href: "../backend/url_shortener_design.html" },
      { name: "DB Design: Indexing", tag: "fri", href: "../database/indexing.html" },
      { name: "Auth basics (JWT/OAuth2)", tag: "core", href: "../backend/auth_jwt_oauth2.html" }
    ]},
    { label: "Week 2", title: "Wire Formats", topics: [
      { name: "HTTP/1.1 vs HTTP/2", tag: "core", href: "../backend/http1_vs_http2.html" },
      { name: "WebSockets", tag: "core", href: "../backend/websockets.html" },
      { name: "gRPC", tag: "core", href: "../backend/grpc.html" },
      { name: "System Design: rate limiter", tag: "thu", href: "../backend/rate_limiter_design.html" },
      { name: "DB Design: Transactions & isolation levels", tag: "fri", href: "../database/transactions_and_isolation.html" },
      { name: "SSE (Server-Sent Events)", tag: "core", href: "../backend/sse.html" }
    ]},
    { label: "Week 3", title: "Async ORMs & DB Ops", topics: [
      { name: "SQLAlchemy async basics", tag: "core", href: "../backend/sqlalchemy_async.html" },
      { name: "AsyncPG / raw async drivers", tag: "core", href: "../backend/raw_async_drivers.html" },
      { name: "Connection pooling", tag: "core", href: "../backend/connection_pooling.html" },
      { name: "System Design: notification service", tag: "thu", href: "../backend/notification_service_design.html" },
      { name: "DB Design: CRUD done right", tag: "fri", href: "../database/crud_done_right.html" },
      { name: "Explicit transactions", tag: "core", href: "../backend/explicit_transactions.html" }
    ]},
    { label: "Week 4", title: "Integration & Survival Exercise", topics: [
      { name: "Streaming architecture integration", tag: "core", href: "../backend/streaming_architecture_integration.html" },
      { name: "System Design: review URL shortener, rate limiter, notification cold", tag: "thu", href: "../backend/system_design_review_cold.html" },
      { name: "DB Design: Migrations with Alembic + SQL vs NoSQL", tag: "fri", href: "../database/migrations_and_sql_vs_nosql_revisited.html" },
      { name: "Survival Exercise: finish & load test", tag: "sat", href: "../backend/survival_exercise_load_test.html" }
    ], checkpoint: "Design a schema for a feature request in under 20 minutes and defend indexing choices. Service survives a basic load test without dropped connections." }
  ]
};

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const monthHeader = document.createElement('div');
  monthHeader.className = 'month-header';
  monthHeader.innerHTML = `<span class="month-title mono">${MONTH.title}</span>`;
  main.appendChild(monthHeader);

  MONTH.weeks.forEach((wk) => {
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `
      <span class="week-num mono">${wk.label}</span>
      <span class="week-title">${wk.title}</span>
    `;
    weekEl.appendChild(head);

    const list = document.createElement('div');
    list.className = 'topic-list';
    wk.topics.forEach((t) => {
      const a = document.createElement('a');
      a.className = 'topic-link';
      a.href = t.href;
      a.innerHTML = `
        <span class="topic-name">${t.name}</span>
        <span class="topic-tag mono">${t.tag}</span>
        <span class="topic-arrow mono">&rarr;</span>
      `;
      list.appendChild(a);
    });
    weekEl.appendChild(list);
    main.appendChild(weekEl);

    if (wk.checkpoint) {
      const cp = document.createElement('div');
      cp.className = 'checkpoint';
      cp.innerHTML = `<div class="checkpoint-label mono">checkpoint — ${wk.label}</div><div class="checkpoint-text">${wk.checkpoint}</div>`;
      main.appendChild(cp);
    }
  });
}

render();
</script>

</body>
</html>
